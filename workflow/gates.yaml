# =============================================================================
# gates.yaml —— 阶段门禁契约（机器可读，check_gate.py 的数据源）
#
# 设计原则（ADR 0009/0020）：
#   - 本文件是【验收标准】，与验证计划同级：修改须经用户评审，Agent 不得自改
#   - 机器检查只能给出 PASS/FAIL/UNKNOWN；gate 的最终通过永远需要用户确认
#   - UNKNOWN 不是失败：表示"机器能查的已查完，剩余项需人工/需先跑工具/证据不足"
#   - fail-closed：证据缺失、歧义（多份匹配无法定位 run）、解析失败 → UNKNOWN，不放行
#
# 检查类型：
#   file_exists            {path}                              文件存在
#   file_filled            {path, min_bytes?, forbid_patterns?} 存在且非占位（无 forbid 模式、够长）
#   yaml_value             {file, key, equals}                 YAML 点路径取值等于期望值
#   modules_ports_check    {}                                  所有 three_piece 模块 core/dft 端口一致
#   interfaces_all_frozen  {min_count?}                        interfaces 全部 frozen: true
#   modules_field_filled   {field, file_must_exist?}           注册模块的字段已填且（可选）文件存在
#   evidence               {glob, require?, bind_git_hash?,    日志 SUMMARY 证据核对；
#                           run?, slow?}                        run 存在时属慢检查，需 --slow 才执行
#   manual                 {question}                          人工项：恒为 UNKNOWN，列出待确认问题
#
# 退出码约定（check_gate.py）：0=PASS，1=FAIL，2=UNKNOWN（含用法错误）
# =============================================================================
version: "0.1.0"

# 阶段入口条件：进入某阶段前必须满足（entry 模式检查）
phases:
  P0: { exit_gate: G1,      entry: [] }
  P1: { exit_gate: G2,      entry: [ { type: gate_done, phase: P0 } ] }
  P2: { exit_gate: P2_EXIT, entry: [ { type: gate_done, phase: P1 } ] }
  P3: { exit_gate: G3,      entry: [ { type: gate_done, phase: P2 } ] }
  P4: { exit_gate: P4_EXIT, entry: [ { type: gate_done, phase: P3 } ] }
  P5: { exit_gate: P5_EXIT, entry: [ { type: gate_done, phase: P4 } ] }
  P6: { exit_gate: G4,      entry: [ { type: gate_done, phase: P5 } ] }

gates:
  # ---------- G1：spec review（P0 出口）----------
  G1:
    name: "spec review"
    checks:
      - id: req_checklist_filled
        type: file_filled
        path: docs/00_project/00-00_需求确认清单.md
        desc: 需求确认清单已填写
      - id: srs_filled
        type: file_filled
        path: docs/00_project/00-02_需求规格说明书_SRS.md
        desc: SRS 已填写
      - id: rtm_filled
        type: file_filled
        path: docs/00_project/00-03_需求跟踪矩阵_RTM.md
        desc: RTM 已建立
      - id: g1_review
        type: manual
        question: "需求确认清单全部勾选？SRS 每条需求量化可衡量？RTM 每行验证方法非空？（用户+领导评审）"

  # ---------- G2：architecture review（P1 出口）----------
  G2:
    name: "architecture review"
    checks:
      - id: hld_filled
        type: file_filled
        path: docs/01_architecture/01-01_系统架构设计_HLD.md
        desc: HLD 已填写
      - id: icd_filled
        type: file_filled
        path: docs/01_architecture/01-02_接口控制文档_ICD.md
        desc: ICD 已填写
      - id: regmap_filled
        type: file_filled
        path: docs/01_architecture/01-03_寄存器映射规格.md
        desc: 寄存器映射已定义
      - id: clk_rst_filled
        type: file_filled
        path: docs/01_architecture/01-04_时钟与复位架构.md
        desc: 时钟复位架构与 CDC 清单已填写
      - id: g2_review
        type: manual
        question: "每条 SRS 功能需求有模块承接？每个接口在 ICD 有章节并登记 interfaces 表？每条 CDC 在 01-04 清单？"

  # ---------- P2 出口：接口冻结 + LLD 冻结 ----------
  P2_EXIT:
    name: "接口冻结 + LLD 冻结"
    checks:
      - id: interfaces_frozen
        type: interfaces_all_frozen
        min_count: 0   # 模板默认为 0；实际项目实例化时应改为 >=1
        desc: "interfaces 全部 frozen: true"
      - id: module_lld_filled
        type: modules_field_filled
        field: lld
        file_must_exist: true
        desc: 每个注册模块（example 除外）LLD 已填且文件存在
      - id: p2_review
        type: manual
        question: "每模块 LLD 评审通过？接口冻结表经用户确认？"

  # ---------- G3：pre-commitment review（P3 出口）----------
  G3:
    name: "pre-commitment review"
    checks:
      - id: ports_consistent
        type: modules_ports_check
        desc: 所有 three_piece 模块 core/dft 功能端口一致
      - id: elab_clean
        type: evidence
        glob: "logs/elab_*.log"
        bind_git_hash: true
        require: { RESULT: PASS, ERRORS: 0 }
        slow: true
        run: "vivado -mode batch -source hw/scripts/check_elab.tcl"
        desc: elaboration 无 error（证据须绑定当前 git hash；--slow 时自动重跑）
      - id: methodology_clean
        type: evidence
        glob: "logs/elab_*.log"
        bind_git_hash: true
        require: { METHODOLOGY_CRITICAL: 0 }
        slow: true
        run: "vivado -mode batch -source hw/scripts/check_elab.tcl"
        desc: report_methodology 无 critical warning

  # ---------- P4 出口：覆盖率 + 全回归 + RTM 回填 ----------
  P4_EXIT:
    name: "覆盖率达标 + 全回归 PASS + RTM 回填"
    checks:
      - id: full_regression_pass
        type: evidence
        glob: "logs/regress_full_*.log"
        bind_git_hash: true
        require:
          RESULT: PASS
          COV_FUNC: { min: 100 }
          COV_LINE: { min: 95 }
          COV_BRANCH: { min: 90 }
        desc: 全回归 PASS 且覆盖率达标（功能 100 / 行 >=95 / 分支 >=90）
      - id: test_matrix_filled
        type: file_filled
        path: docs/03_verification/03-02_测试矩阵.md
        desc: 测试矩阵已回填结果
      - id: rtm_backfilled
        type: file_filled
        path: docs/00_project/00-03_需求跟踪矩阵_RTM.md
        desc: RTM 已回填验证状态
      - id: p4_review
        type: manual
        question: "覆盖率豁免项经过独立评审？RTM 验证状态与实际证据一致？"

  # ---------- P5 出口：时序收敛 ----------
  P5_EXIT:
    name: "WNS>=0 + DRC 干净 + 资源达标"
    checks:
      - id: timing_closed
        type: evidence
        glob: "logs/impl_*.log"
        bind_git_hash: true
        require:
          RESULT: PASS
          WNS_NS: { min: 0 }
          METHODOLOGY_CRITICAL: 0
          DRC_CRITICAL: 0
        desc: post-route WNS>=0 且 methodology/DRC 无 critical
      - id: p5_review
        type: manual
        question: "资源占用 < HLD 预算？时序例外（false_path/multicycle）经过独立评审？"

  # ---------- G4：release review（P6 出口）----------
  G4:
    name: "release review"
    checks:
      - id: board_report_filled
        type: file_filled
        path: docs/05_bringup/05-04_板级测试报告.md
        desc: 板级测试报告已填写
      - id: release_notes_filled
        type: file_filled
        path: docs/07_release/07-01_Release_Notes.md
        desc: Release Notes 已填写（比特流嵌 git hash）
      - id: g4_review
        type: manual
        question: "板级用例全过？三路比对差异在量化误差内？Release 包完整（比特流嵌 git hash）？"
